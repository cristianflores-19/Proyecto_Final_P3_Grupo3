server.port=8080

# 1. ACTIVAR EL MOTOR DE POSTGRESQL
app.storage=postgres
app.tree-strategy=custom

# 2. CONEXIÓN AL NUEVO CONTENEDOR (Puerto 5433 y la clave que elegiste)
spring.datasource.url=jdbc:postgresql://localhost:5433/organigrama_db
spring.datasource.username=postgres
spring.datasource.password=proyecto

# 3. CONFIGURACIÓN DE HIBERNATE PARA QUE CREE LAS TABLAS SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect