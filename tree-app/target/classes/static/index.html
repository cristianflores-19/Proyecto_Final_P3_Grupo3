<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosystem Tree - Organigrama Empresarial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .node rect { fill: #1e293b; stroke: #38bdf8; stroke-width: 2px; transition: all 0.3s ease; }
        .node:hover rect { fill: #0f172a; stroke: #0ea5e9; filter: drop-shadow(0 4px 6px rgba(56, 189, 248, 0.2)); }
        .link { fill: none; stroke: #475569; stroke-width: 2px; stroke-dasharray: 4 4; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f1424; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-200 min-h-screen font-sans flex flex-col h-screen overflow-hidden">

    <header class="border-b border-slate-800 bg-[#0f1424] px-6 py-4 flex justify-between items-center shadow-lg shrink-0">
        <div class="flex items-center space-x-3">
            <div class="h-3 w-3 bg-sky-400 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wider text-slate-100">ORGANIGRAMA <span class="text-sky-400">CORE</span></h1>
        </div>
        <div class="flex space-x-3">
            <button onclick="validarEstructura()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sky-400 border border-sky-500/30 rounded-lg text-sm font-semibold tracking-wide transition-all shadow-md">
                🔍 Validar Estructura (Ciclos)
            </button>
            <button onclick="cargarOrganigrama()" class="px-4 py-2 bg-sky-500 hover:bg-sky-600 text-slate-900 rounded-lg text-sm font-bold tracking-wide transition-all shadow-md">
                🔄 Sincronizar Árbol
            </button>
        </div>
    </header>

    <main class="flex flex-1 overflow-hidden">
        <section class="w-80 bg-[#0f1424] border-r border-slate-800 p-5 flex flex-col gap-4 overflow-y-auto shadow-2xl shrink-0">
            <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl shrink-0">
                <h2 class="text-[11px] font-bold uppercase tracking-wider text-sky-400 mb-3">👑 Construir Jerarquía</h2>
                <div class="space-y-2 mb-4">
                    <input type="text" id="rootValue" placeholder="Nombre Puesto Raíz" class="w-full px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-md text-sm text-slate-100 focus:outline-none focus:border-sky-500">
                    <button onclick="crearRaiz()" class="w-full py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-md text-xs font-bold uppercase tracking-wider transition-all">Crear Nueva Raíz</button>
                </div>
                <div class="space-y-2 pt-3 border-t border-slate-800">
                    <div class="flex gap-2">
                        <input type="number" id="parentId" placeholder="ID Jefe" class="w-1/3 px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-md text-sm text-slate-100 focus:outline-none focus:border-sky-500">
                        <input type="text" id="childValue" placeholder="Nombre Subordinado" class="w-2/3 px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-md text-sm text-slate-100 focus:outline-none focus:border-sky-500">
                    </div>
                    <button onclick="agregarHijo()" class="w-full py-1.5 bg-sky-500 hover:bg-sky-400 text-slate-900 rounded-md text-xs font-bold uppercase tracking-wider transition-all">Colgar Subordinado</button>
                </div>
            </div>

            <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl shrink-0">
                <h2 class="text-[11px] font-bold uppercase tracking-wider text-purple-400 mb-3">🧠 Motor de Algoritmos</h2>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <button onclick="ejecutarAlgoritmo('/dfs', 'Recorrido DFS')" class="py-1.5 bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-500/30 rounded-md text-[10px] font-bold uppercase">Ruta DFS</button>
                    <button onclick="ejecutarAlgoritmo('/bfs', 'Recorrido BFS')" class="py-1.5 bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-500/30 rounded-md text-[10px] font-bold uppercase">Ruta BFS</button>
                    <button onclick="ejecutarAlgoritmo('/height', 'Altura del Árbol')" class="col-span-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-500/30 rounded-md text-[10px] font-bold uppercase">Calcular Altura Máxima</button>
                </div>
                <div class="space-y-2 pt-3 border-t border-slate-800">
                    <input type="number" id="targetNodeId" placeholder="ID del Nodo a analizar" class="w-full px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-md text-sm text-slate-100 focus:outline-none focus:border-purple-500">
                    <div class="grid grid-cols-3 gap-1">
                        <button onclick="algoritmoPorNodo('depth', 'Profundidad')" class="py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded-md text-[10px] font-bold">Prof.</button>
                        <button onclick="algoritmoPorNodo('ancestors', 'Ancestros')" class="py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded-md text-[10px] font-bold">Ances.</button>
						<button onclick="algoritmoPorNodo('path', 'Camino')" class="py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded-md text-[10px] font-bold">Camino</button>                </div>
            </div>

            <div class="flex-1 flex flex-col min-h-[180px] shrink-0">
                <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 tracking-wider">Logs del Sistema</label>
                <div id="consoleLogs" class="flex-1 bg-slate-950 border border-slate-800 p-3 rounded-md text-xs font-mono text-emerald-400 overflow-y-auto">
                    > Entorno web listo...
                </div>
            </div>
        </section>

        <section id="canvasContainer" class="flex-1 relative overflow-auto flex items-center justify-center bg-[#070a13]">
            <div id="emptyState" class="absolute text-center p-6 text-slate-500 font-medium">
                <p class="text-lg">Árbol Vacío</p>
                <p class="text-xs text-slate-600 mt-1">Crea un nodo raíz lateral para inicializar el gráfico</p>
            </div>
            <svg id="treeCanvas" class="w-full h-full min-w-[800px] min-h-[600px]"></svg>
        </section>
    </main>

    <script>
        const API_BASE_URL = window.location.origin + "/api/v1/tree";

        function logMessage(text, isError = false, isAlgo = false) {
            const consoleBox = document.getElementById("consoleLogs");
            const logEntry = document.createElement("p");
            logEntry.className = isError ? "text-rose-400 py-0.5" : (isAlgo ? "text-purple-400 py-0.5" : "text-emerald-400 py-0.5");
            logEntry.innerHTML = `> ${text}`;
            consoleBox.appendChild(logEntry);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        async function crearRaiz() {
            const val = document.getElementById("rootValue").value.trim();
            if (!val) return alert("Escribe un nombre para la raíz");
            try {
                const res = await fetch(`${API_BASE_URL}/root?value=${encodeURIComponent(val)}`, { method: 'POST' });
                if (!res.ok) throw new Error(await res.text());
                logMessage(`Raíz "${val}" establecida correctamente.`);
                document.getElementById("rootValue").value = "";
                cargarOrganigrama();
            } catch (err) { logMessage(`Error al crear raíz. Verifica la consola de Java.`, true); }
        }

        async function agregarHijo() {
            const pid = document.getElementById("parentId").value.trim();
            const val = document.getElementById("childValue").value.trim();
            if (!pid || !val) return alert("Faltan campos para insertar el hijo");
            try {
                const res = await fetch(`${API_BASE_URL}/${pid}/child?value=${encodeURIComponent(val)}`, { method: 'POST' });
                if (!res.ok) throw new Error(await res.text());
                logMessage(`Nodo "${val}" colgado de ID ${pid}.`);
                document.getElementById("childValue").value = "";
                document.getElementById("parentId").value = "";
                cargarOrganigrama();
            } catch (err) { logMessage(`Fallo de inserción: El ID ${pid} no existe o causó error de relación.`, true); }
        }

        async function validarEstructura() {
            try {
                const res = await fetch(`${API_BASE_URL}/validate`);
                const data = await res.text();
                logMessage(`[Validación Ciclos]: El árbol es válido = ${data.toUpperCase()}`, false, true);
            } catch (err) { logMessage(`Error validando: ${err.message}`, true); }
        }

        async function ejecutarAlgoritmo(ruta, nombre) {
            try {
                const res = await fetch(`${API_BASE_URL}${ruta}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.text();
                logMessage(`[${nombre}]: ${data}`, false, true);
            } catch (err) { logMessage(`Error en ${nombre}: Tu motor de Java arrojó código 500.`, true); }
        }

		async function algoritmoPorNodo(endpoint, nombre) {
		            const nodeId = document.getElementById("targetNodeId").value.trim();
		            if(!nodeId) {
		                alert("Ingresa un ID primero");
		                return;
		            }
		            try {
		                // Mapeo exacto según tu TreeController: /api/v1/tree/algoritmo/id
		                const res = await fetch(`${API_BASE_URL}/${endpoint}/${nodeId}`);
		                
		                if (!res.ok) throw new Error(`HTTP Status ${res.status}`);
		                const data = await res.text();
		                
		                // Si la respuesta es un arreglo JSON (como en path o ancestors), lo unimos bonito
		                if (data.startsWith("[")) {
		                    try {
		                        const arrayData = JSON.parse(data);
		                        if (arrayData.length === 0) {
		                            logMessage(`[${nombre} Nodo ${nodeId}]: No se encontraron elementos.`);
		                        } else {
		                            logMessage(`[${nombre} Nodo ${nodeId}]: ${arrayData.join(" ➔ ")}`, false, true);
		                        }
		                        return;
		                    } catch(e) { /* Flujo normal si falla */ }
		                }
		                
		                logMessage(`[${nombre} Nodo ${nodeId}]: ${data}`, false, true);
		            } catch (err) { 
		                logMessage(`Error en ${nombre}: El ID ${nodeId} no existe en el motor actual.`, true); 
		            }
		        }

        async function cargarOrganigrama() {
            try {
                const res = await fetch(API_BASE_URL);
                if (!res.ok) throw new Error("Status " + res.status);
                
                const textData = await res.text(); 
                if (!textData || textData.trim() === "") {
                    document.getElementById("emptyState").style.display = "block";
                    d3.select("#treeCanvas").selectAll("*").remove();
                    return;
                }

                const rawData = JSON.parse(textData);
                if (!rawData || !rawData.value) {
                    document.getElementById("emptyState").style.display = "block";
                    d3.select("#treeCanvas").selectAll("*").remove();
                    return;
                }

                document.getElementById("emptyState").style.display = "none";
                renderD3Tree(rawData);
            } catch (err) {
                document.getElementById("emptyState").style.display = "block";
                d3.select("#treeCanvas").selectAll("*").remove();
            }
        }

        function renderD3Tree(hierarchyData) {
            const svgSelection = d3.select("#treeCanvas");
            svgSelection.selectAll("*").remove();

            const svgElement = document.getElementById("treeCanvas");
            const width = svgElement.clientWidth || 800;
            const height = svgElement.clientHeight || 600;
            const margin = { top: 40, right: 20, bottom: 40, left: 20 };

            const g = svgSelection
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const root = d3.hierarchy(hierarchyData);
            const treeLayout = d3.tree().size([width - margin.left - margin.right, height - 140]);
            treeLayout(root);

            g.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkVertical().x(d => d.x).y(d => d.y));

            const nodeWidth = 140;
            const nodeHeight = 50;

            const node = g.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.x - nodeWidth / 2},${d.y})`);

            node.append("rect").attr("width", nodeWidth).attr("height", nodeHeight).attr("rx", 8);

            node.append("text")
                .attr("x", 8).attr("y", 16).attr("fill", "#38bdf8")
                .style("font-size", "9px").style("font-weight", "bold")
                .text(d => `ID: ${d.data.id}`);

            node.append("text")
                .attr("x", nodeWidth / 2).attr("y", 34).attr("text-anchor", "middle").attr("fill", "#f1f5f9")
                .style("font-size", "11px").style("font-weight", "500")
                .text(d => d.data.value.length > 20 ? d.data.value.substring(0, 18) + "..." : d.data.value);
        }

        window.onload = cargarOrganigrama;
    </script>
</body>
</html>
